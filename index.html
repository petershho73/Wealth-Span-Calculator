<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LifeOS™ — Wealth Span</title>
<style>
  :root {
    --paper: #F4F1EA;
    --card: #FFFFFF;
    --line: #E1DCCC;
    --ink: #22262B;
    --ink-dim: #767C82;
    --brass: #96742B;
    --rust: #B14A33;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    min-height: 100%;
    overflow-x: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
             max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: var(--ink);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(34,38,43,0.06);
    padding: 28px 24px 26px;
    width: 100%;
    max-width: 380px;
    box-sizing: border-box;
    text-align: center;
  }
  .brand {
    font-family: 'Georgia', 'Iowan Old Style', serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .brand sup { font-size: 10px; }
  .subtitle {
    margin-top: 4px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 600;
  }
  h1 {
    font-family: 'Georgia', 'Iowan Old Style', serif;
    font-size: 17px;
    font-weight: 400;
    margin: 14px 0 4px;
    color: var(--ink);
  }
  .desc {
    font-size: 12.5px;
    color: var(--ink-dim);
    line-height: 1.5;
    margin: 0 0 20px;
  }
  form { display: flex; flex-direction: column; gap: 10px; }
  input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    padding: 11px 12px;
    font-size: 15px;
    text-align: center;
    letter-spacing: 0.05em;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--brass);
  }
  button {
    background: var(--brass);
    color: var(--card);
    border: none;
    border-radius: 8px;
    padding: 11px 12px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { opacity: 0.85; }
  .error {
    display: none;
    font-size: 11.5px;
    color: var(--rust);
    font-weight: 600;
    margin-top: -2px;
  }
  .footer {
    margin-top: 22px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 9.5px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">LifeOS<sup>™</sup></div>
    <div class="subtitle">5 Span Module · Wealth Span</div>
    <h1>Wealth Span Calculator</h1>
    <p class="desc">This preview is password-protected.<br />Enter the access password to continue.</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="password" placeholder="Password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <div class="error" id="error">Incorrect password. Please try again.</div>
      <button type="submit">Enter</button>
    </form>
    <div class="footer">
      Designed and Developed by Peter Ho<br />
      All Rights Reserved &#174;
    </div>
  </div>

<script>
  // Client-side gate only -- this keeps casual visitors out of a preview
  // link, but it is not real security: the page source (and this password)
  // is visible to anyone who inspects it, and app.html can still be
  // reached directly if someone knows or guesses that URL.
  var CORRECT_PASSWORD = "SG61!";
  var form = document.getElementById("gate-form");
  var input = document.getElementById("password");
  var error = document.getElementById("error");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (input.value === CORRECT_PASSWORD) {
      window.location.href = "app.html";
    } else {
      error.style.display = "block";
      input.value = "";
      input.focus();
    }
  });
</script>
</body>
</html>
